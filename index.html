<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyRPG Player</title>
  <style>
    :root {
      --color-gray: hsl(0, 0%, 55%);
      --controls-size: 10vh;
      --button-size: 50px;
      --small-button-size: 40px;
    }
    @media (orientation: landscape) {
      :root {
        --controls-size: 20vh;
        --button-size: 50px;
        --small-button-size: 45px;
      }
    }
    html {
      touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      color: white;
      background: black;
    }
    .unselectable {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #status {
      font-size: 1.5rem;
      color: var(--color-gray);
      text-align: center;
    }
    #controls {
      position: relative;
      text-align: right;
      z-index: 10;
    }
    #controls button {
      -webkit-appearance: button;
      display: inline-flex;
      background: transparent;
      border: 0;
      color: white;
      font-family: inherit;
      font-size: 1em;
      line-height: inherit;
      cursor: pointer;
      padding: 0.5rem;
    }
    #controls svg {
      pointer-events: none;
    }
    #canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transform: translate(-50%, -50%);
    }
    img#canvas {
      object-fit: contain;
    }

    /* 十字ボタン（左下） */
    #dpad {
      position: fixed;
      bottom: 20px;
      left: 20px;
    }
    #dpad svg {
      width: calc(2 * var(--controls-size));
      height: calc(2 * var(--controls-size));
      fill: var(--color-gray);
    }
    #dpad svg rect {
      opacity: 0.4;
    }

    /* 右側のボタン群 - 画面全体に散らす */
    #apad {
      position: fixed;
      bottom: 0px;
      right: 0px;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    /* 各ボタンにpointer-eventsを復活 */
    .game-button {
      pointer-events: all;
    }

    /* 肩ボタン（L/R） - 左側に縦配置、間隔調整 */
    #shoulders {
      position: fixed;
      top: 120px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 設定ボタン（三本線、左上） */
    #menu-button {
      position: fixed;
      top: 20px;
      left: 20px;
    }

    /* その他のボタン（+、-、*） - 上部中央に配置 */
    #extra-buttons {
      position: fixed;
      top: 10px;
      left: 55%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    /* 共通ボタンスタイル */
    .game-button {
      background-color: var(--color-gray);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
      position: absolute;
    }

    .game-button:not(.active) {
      opacity: 0.7;
    }

    .game-button.active {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.8);
      color: black;
      transform: scale(0.95);
    }

       /* X */
#btn-x {
  width: var(--button-size);
  height: var(--button-size);
  right: 60px;
  bottom: 130px;
}

/* A */
#btn-a {
  width: var(--button-size);
  height: var(--button-size);
  right: 10px;
  bottom: 80px;
}

/* B */
#btn-b {
  width: var(--button-size);
  height: var(--button-size);
  right: 60px;
  bottom: 30px;
}

/* Y（Xの左） */
#btn-y {
  width: var(--button-size);
  height: var(--button-size);
  right: 110px;
  bottom: 80px;
}

/* --- 上に四角く並ぶボタン群 LRTS --- */

/* 正方形エリアの基準左上： right: 120px; bottom: 240px; */

/* L（左上） */
#btn-l {
  width: var(--button-size);
  height: var(--button-size);
  position: absolute;
  right: 110px;
  bottom: 230px;
}

/* R（右上） */
#btn-r {
  width: var(--button-size);
  height: var(--button-size);
  position: absolute;
  right: 10px;
  bottom: 230px;
}

/* T（左下） */
#btn-t {
  width: var(--button-size);
  height: var(--button-size);
  position: absolute;
  right: 110px;
  bottom: 170px;
}

/* S（右下） */
#btn-s {
  width: var(--button-size);
  height: var(--button-size);
  position: absolute;
  right: 10px;
  bottom: 170px;
}



    /* 設定ボタン */
    #btn-menu {
      width: var(--small-button-size);
      height: var(--small-button-size);
      background-color: var(--color-gray);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.1s ease;
    }

    #btn-menu.active {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.8);
      color: black;
    }

    /* その他のボタン - サイズを少し大きく */
    .extra-button {
      width: 40px;
      height: 40px;
      background-color: var(--color-gray);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.1s ease;
    }

    .extra-button.active {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.8);
      color: black;
    }

    #dpad path:not(.active),
    #apad > *:not(.active) {
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="controls-fullscreen" class="unselectable" aria-label="Toggle Fullscreen">
      <svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" width="25" height="25">
        <path d="M13.5 13.5H10m3.5 0V10m0 3.5l-4-4m.5-8h3.5m0 0V5m0-3.5l-4 4M5 1.5H1.5m0 0V5m0-3.5l4 4m-4 4.5v3.5m0 0H5m-3.5 0l4-4" stroke="currentColor" />
      </svg>
    </button>
  </div>

  <div id="status"></div>

  <div id="viewport">
    <canvas id="canvas" tabindex="-1" class="unselectable"></canvas>

    <!-- 十字ボタン（左下） -->
    <div id="dpad" class="unselectable">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
        <path id="dpad-up" data-key="ArrowUp" d="M48,5.8C48,2.5,45.4,0,42,0H29.9C26.6,0,24,2.4,24,5.8V24h24V5.8z" />
        <path id="dpad-right" data-key="ArrowRight" d="M66.2,24H48v24h18.2c3.3,0,5.8-2.7,5.8-6V29.9C72,26.5,69.5,24,66.2,24z" />
        <path id="dpad-down" data-key="ArrowDown" d="M24,66.3c0,3.3,2.6,5.7,5.9,5.7H42c3.3,0,6-2.4,6-5.7V48H24V66.3z" />
        <path id="dpad-left" data-key="ArrowLeft" d="M5.7,24C2.4,24,0,26.5,0,29.9V42c0,3.3,2.3,6,5.7,6H24V24H5.7z" />
        <rect id="dpad-center" x="24" y="24" width="24" height="24" />
      </svg>
    </div>

    <!-- 右側のボタン群 -->
    <div id="apad" class="unselectable">
      <!-- Aボタン（決定）一番右 -->
      <div id="btn-a" class="game-button" data-key="KeyZ">A</div>
      <!-- Bボタン（キャンセル）Aの少し左下 -->
      <div id="btn-b" class="game-button" data-key="KeyX">B</div>
      <!-- Yボタン（Aの左） -->
      <div id="btn-y" class="game-button" data-key="KeyC">Y</div>
      <!-- Xボタン（Aの少し左上） -->
      <div id="btn-x" class="game-button" data-key="KeyV">X</div>
      <!-- Sボタン（ダッシュ）Xの少し右上 -->
      <div id="btn-s" class="game-button" data-key="ShiftLeft">S</div>
      <!-- Tボタン（サブメニュー）Sの少し左 -->
      <div id="btn-t" class="game-button" data-key="Tab">T</div>
      <!-- 肩ボタン（四角内配置） -->
      <div id="btn-l" class="game-button" data-key="KeyQ">L</div>
      <div id="btn-r" class="game-button" data-key="KeyW">R</div>

    </div>

    <!-- 肩ボタン（Sの上） -->
    <div id="shoulders" class="unselectable">
      <div id="btn-l" class="game-button" data-key="KeyQ">L</div>
      <div id="btn-r" class="game-button" data-key="KeyW">R</div>
    </div>

    <!-- 設定ボタン（三本線、左上） -->
    <div id="menu-button" class="unselectable">
      <div id="btn-menu" data-key="F1">☰</div>
    </div>

    <!-- その他のボタン（+、-、*） -->
      <div id="extra-buttons" class="unselectable">
      <div class="extra-button" data-key="F11">F11</div>
      <div class="extra-button" data-key="CTRLLeft">CTRL</div>
      <div class="extra-button" data-key="F">F</div>
      <div class="extra-button" data-key="F12">F12</div>      
      <div class="extra-button" data-key="Plus">+</div>
      <div class="extra-button" data-key="Minus">-</div>
      <div class="extra-button" data-key="Multiply">*</div>
    </div>
  </div>

  <script async type="text/javascript" src="index.js"></script>

  <script>
    const hasTouchscreen = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    const preventNativeKeys = ['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft', ' ', 'F12'];
    const keys = new Map();
    const keysDown = new Map();
    const canvas = document.getElementById('canvas');
    let easyrpgPlayer;
    let lastTouchedId;

    window.addEventListener('load', (event) => {
      createEasyRpgPlayer({
        game: undefined,
        saveFs: undefined
      }).then(function(Module) {
        easyrpgPlayer = Module;
        easyrpgPlayer.initApi();
        canvas.focus();
      });
    });

    canvas.addEventListener('mouseenter', () => canvas.focus());
    canvas.addEventListener('click', () => canvas.focus());

    document.querySelector('#controls-fullscreen').addEventListener('click', () => {
      const viewport = document.getElementById('viewport');
      if (viewport.requestFullscreen) {
        viewport.requestFullscreen();
      }
    });

    function simulateKeyboardEvent(eventType, key) {
      const event = new Event(eventType, { bubbles: true });
      event.code = key;
      canvas.dispatchEvent(event);
    }

    function simulateKeyboardInput(key) {
      simulateKeyboardEvent('keydown', key);
      window.setTimeout(() => {
        simulateKeyboardEvent('keyup', key);
      }, 100);
    }

    function bindKey(node, key) {
      keys.set(node.id, key);

      node.addEventListener('touchstart', event => {
        event.preventDefault();
        simulateKeyboardEvent('keydown', key);
        keysDown.set(event.target.id, node.id);
        node.classList.add('active');
      });

      node.addEventListener('touchend', event => {
        event.preventDefault();

        const pressedKey = keysDown.get(event.target.id);
        if (pressedKey && keys.has(pressedKey)) {
          const key = keys.get(pressedKey);
          simulateKeyboardEvent('keyup', key);
        }

        keysDown.delete(event.target.id);
        node.classList.remove('active');

        if (lastTouchedId) {
          document.getElementById(lastTouchedId).classList.remove('active');
        }
      });

      node.addEventListener('touchmove', event => {
        const { target, clientX, clientY } = event.changedTouches[0];
        const origTargetId = keysDown.get(target.id);
        const nextTargetId = document.elementFromPoint(clientX, clientY).id;
        if (origTargetId === nextTargetId) return;

        if (origTargetId) {
          const key = keys.get(origTargetId);
          simulateKeyboardEvent('keyup', key);
          keysDown.delete(target.id);
          document.getElementById(origTargetId).classList.remove('active');
        }

        if (keys.has(nextTargetId)) {
          const key = keys.get(nextTargetId);
          simulateKeyboardEvent('keydown', key);
          keysDown.set(target.id, nextTargetId);
          lastTouchedId = nextTargetId;
          document.getElementById(nextTargetId).classList.add('active');
        }
      });
    }

    let gamepads = {};
    const haveEvents = 'ongamepadconnected' in window;

    function addGamepad(gamepad) {
      if (gamepad == undefined) return;
      gamepads[gamepad.index] = gamepad;
      // キーボードイベントも処理
    window.addEventListener('keydown', event => {
      if (preventNativeKeys.includes(event.key)) {
        event.preventDefault();
      }
    });

    canvas.addEventListener('contextmenu', event => {
      event.preventDefault();
    });

    updateTouchControlsVisibility();
    }

    function removeGamepad(gamepad) {
      if (gamepad == undefined) return;
      delete gamepads[gamepad.index];
      updateTouchControlsVisibility();
    }

    function getGamepads() {
      return navigator.getGamepads ? navigator.getGamepads() : (navigator.webkitGetGamepads ? navigator.webkitGetGamepads() : []);
    }

    function scanGamePads() {
      var pads = getGamepads();
      for (var i = 0; i < pads.length; i++) {
        if (pads[i]) {
          if (pads[i].index in gamepads) {
            gamepads[pads[i].index] = pads[i];
          } else {
            addGamepad(pads[i]);
          }
        }
      }
    }

    if (!haveEvents) {
      setInterval(scanGamePads, 500);
    }

    window.addEventListener('gamepadconnected', e => addGamepad(e.gamepad));
    window.addEventListener('gamepaddisconnected', e => removeGamepad(e.gamepad));

    function updateTouchControlsVisibility() {
      // 常時表示
      for (const elem of document.querySelectorAll('#dpad, #apad, #shoulders, #menu-button, #extra-buttons')) {
        elem.style.display = '';
      }
    }

    // 常時表示：タッチスクリーンでもマウス/キーボードでもボタンを表示
    for (const button of document.querySelectorAll('[data-key]')) {
      bindKey(button, button.dataset.key);
    }

    updateTouchControlsVisibility();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
